query ($id: CiPipelineID!, $jobs: Boolean = true, $jobsAfter: String, $project: ID!) {
  project(fullPath: $project) {
    fullPath
    pipeline(id: $id) {
      finishedAt
      id
      jobs(first: 100, after: $jobsAfter, retried: false) @include(if: $jobs) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          allowFailure
          id
          name
          status
          webPath
        }
      }
      path
      sha
      status
    }
  }
}
