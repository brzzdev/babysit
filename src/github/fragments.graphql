
fragment author on Actor {
  __typename
  login
  ... on Node {
    id
  }
}

fragment comment on Comment {
  author {
    ...author
  }
  body
  createdAt
  editor {
    ...author
  }
  lastEditedAt
  ... on IssueComment {
    databaseId
    url
  }
  ... on PullRequestReviewComment {
    databaseId
    url
  }
}
