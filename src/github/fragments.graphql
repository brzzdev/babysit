
fragment author on Actor {
  __typename
  login
}

fragment comment on Comment {
  author {
    ...author
  }
  body
  createdAt
  editor {
    ...author
  }
  lastEditedAt
  ... on IssueComment {
    databaseId
    url
  }
  ... on PullRequestReviewComment {
    databaseId
    url
  }
}

fragment threadComments on PullRequestReviewCommentConnection {
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    ...comment
    pullRequestReview {
      databaseId
      state
    }
  }
}
