query (
  $id: ID!
  $checks: Boolean = true
  $checksAfter: String
  $comments: Boolean = true
  $commentsAfter: String
  $dismissals: Boolean = true
  $dismissalsAfter: String
  $reviews: Boolean = true
  $reviewsAfter: String
  $threads: Boolean = true
  $threadsAfter: String
) {
  node(id: $id) {
    ... on PullRequest {
      state
      headRefOid
      commits(last: 1) {
        nodes {
          commit {
            oid
            statusCheckRollup {
              state
              contexts(first: 100, after: $checksAfter) @include(if: $checks) {
                pageInfo {
                  hasNextPage
                  endCursor
                }
                nodes {
                  __typename
                  ... on CheckRun {
                    checkSuite {
                      databaseId
                      workflowRun {
                        databaseId
                      }
                    }
                    conclusion
                    databaseId
                    detailsUrl
                    isRequired(pullRequestId: $id)
                    name
                    status
                  }
                  ... on StatusContext {
                    context
                    isRequired(pullRequestId: $id)
                    state
                    targetUrl
                  }
                }
              }
            }
          }
        }
      }
      comments(first: 100, after: $commentsAfter) @include(if: $comments) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...comment
        }
      }
      dismissals: timelineItems(
        first: 100
        after: $dismissalsAfter
        itemTypes: [REVIEW_DISMISSED_EVENT]
      ) @include(if: $dismissals) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ... on ReviewDismissedEvent {
            actor {
              ...author
            }
            createdAt
            review {
              databaseId
              state
            }
          }
        }
      }
      reviews(first: 100, after: $reviewsAfter) @include(if: $reviews) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          databaseId
          author {
            ...author
          }
          state
          body
          submittedAt
          url
        }
      }
      reviewThreads(first: 100, after: $threadsAfter) @include(if: $threads) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          isResolved
          resolvedBy {
            ...author
          }
          path
          line
          comments(first: 100) {
            ...threadComments
          }
        }
      }
    }
  }
}
